# bento box config. `overlay` lists repo dirs the box shadows with its own
# (linux) copies, kept in the box's state dir — platform-specific build
# artifacts that must not mix between the host and the box.
overlay:
  - target
# quota_gib: GiB the box may add to each writable bind (checkout, overlays,
# git dir); default 64. Guards the host disk; msb's own default is 4.

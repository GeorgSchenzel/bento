[package]
name = "bento"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
microsandbox = "0.7.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
